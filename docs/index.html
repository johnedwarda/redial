<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reDial — interactive prototype</title>
<meta name="description" content="Interactive prototype of reDial, a phone app rethought for one thumb.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23111113%22/%3E%3Cg transform=%22translate%2813 9.5%29 scale%280.47%29 translate%28-2 -6%29%22%3E%3Cpath d=%22M14 34H26V84Q26 98 12 98H6V87H9Q14 87 14 82Z%22 fill=%22%23F6F6F3%22/%3E%3Ccircle cx=%2220%22 cy=%2218%22 r=%227.5%22 fill=%22%236A5CFF%22/%3E%3Cpath d=%22M35.5 57H73.5A19 19 0 1 0 69.1 69.2%22 fill=%22none%22 stroke=%22%23F6F6F3%22 stroke-width=%2211%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --pill: #3B2BEF; --on-pill: #FFFFFF; --bg: #E8ECF1; --ink: #14171C; --muted: #5A6170; --line: rgba(20,23,28,0.14); --on: #0E6B66; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  header { width: 100%; flex: none; padding: 16px 20px; display: flex; align-items: center; justify-content: flex-start; gap: 10px; }
  header .je { width: 24px; height: 29px; display: block; flex: none; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; min-width: 0; }
  @media (max-width: 389px) { h1 .ip { display: none; } }
  h1 span { color: var(--muted); font-weight: 400; }
  main { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 16px 0 24px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .frame { position: relative; overflow: hidden; border-radius: var(--r, 44px); background: #000;
    box-shadow: 0 0 0 var(--b, 10px) #0B0D10, 0 0 0 calc(var(--b, 10px) + 1px) var(--line), 0 24px 60px rgba(0,0,0,0.35); }
  .stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  .status { padding: 24px; color: var(--muted); font-size: 14px; }
  body.phone header { padding: 12px 16px; }
  body.phone h1 { font-size: 15px; }
  body.phone main { padding: 0 0 12px; align-items: center; }
  #back { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 18px; border: 0;
    border-radius: 22px; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); font-family: inherit; font-size: 15px; font-weight: 500; line-height: 1;
    cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.25s; }
  #back:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); }
  #back .dot { width: 32px; height: 32px; border-radius: 16px; background: var(--pill); color: var(--on-pill); display: grid; place-items: center;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #back:hover .dot { transform: translateX(-3px); }
  #back:active .dot { transform: scale(0.92); }
  #back:focus-visible { outline: 2px solid var(--pill); outline-offset: 3px; }
  @media (max-width: 519px) { #back { height: 40px; border-radius: 20px; padding: 0 6px 0 16px; gap: 10px; font-size: 14px; } #back .dot { width: 28px; height: 28px; border-radius: 14px; } }
  @media (prefers-reduced-motion: reduce) { #back .dot { transition: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<header>
  <svg class="je" viewBox="2 6 81 96" role="img" aria-label="John Edward"><path d="M14 34H26V84Q26 98 12 98H6V87H9Q14 87 14 82Z" fill="currentColor"/><circle cx="20" cy="18" r="7.5" fill="#6A5CFF"/><path d="M35.5 57H73.5A19 19 0 1 0 69.1 69.2" fill="none" stroke="currentColor" stroke-width="11"/></svg>
  <h1>reDial <span>· <span class="ip">interactive </span>prototype</span></h1>
  <button id="back" class="pill" type="button"><span>Back</span><span class="dot"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M11.5 7H2.5M6 3.5 2.5 7 6 10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
</header>
<main>
  <figure id="main">
    <div class="frame"><div class="stage"><p class="status">Loading…</p></div></div>
  </figure>
</main>
<script>
  const W = 390, H = 844;
  const params = new URLSearchParams(location.search);
  // ?view=home|contacts|dialer|call picks the prototype's starting screen.
  const fig = document.getElementById('main');

  function layout() {
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const phone = vw < 520;
    document.body.classList.toggle('phone', phone);
    // the frame's border (10px at full size) and corner radius scale with the phone
    const B = 10, RI = 44;
    const hh = document.querySelector('header').offsetHeight;
    const s = phone ? Math.min((vw - 40) / (W + 2 * B), (vh - hh - 12 - 36) / (H + 2 * B))
      : Math.min(1, (vh - hh - 16 - 2 * B - 24) / H, (vw - 32 - 2 * B) / W);
    const frame = fig.querySelector('.frame');
    frame.style.width = W * s + 'px';
    frame.style.height = H * s + 'px';
    frame.style.setProperty('--b', B * s + 'px');
    frame.style.setProperty('--r', RI * s + 'px');
    fig.querySelector('.stage').style.transform = 'scale(' + s + ')';
  }
  const back = document.getElementById('back');
  // Same as the browser's Back button; if this page was opened in a new tab, return to the page that linked here.
  back.addEventListener('click', function () {
    if (window.history.length > 1) { window.history.back(); return; }
    if (document.referrer) { window.location.href = document.referrer; return; }
    window.close();
  });
  window.addEventListener('resize', layout);
  layout();
  if (document.fonts) document.fonts.ready.then(layout);

  const view = params.get('view');
  const props = view ? { startScreen: view } : {};
  DCLite.mount(document.querySelector('#main .stage'), 'prototype/Prototype.dc.html', props)
    .catch((e) => { document.querySelector('#main .stage').innerHTML = '<p class="status"></p>'; document.querySelector('#main .status').textContent = e.message; });
</script>
</body>
</html>
