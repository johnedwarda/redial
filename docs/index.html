<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reDial — interactive prototype</title>
<meta name="description" content="Interactive prototype of reDial, a phone app rethought for one thumb.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230E6B66%22/%3E%3Cpath d=%22M17.5 14.6v1.9a1.3 1.3 0 0 1-1.4 1.3 12.8 12.8 0 0 1-5.6-2 12.6 12.6 0 0 1-3.9-3.9 12.8 12.8 0 0 1-2-5.6A1.3 1.3 0 0 1 5.9 5h1.9a1.3 1.3 0 0 1 1.3 1.1c.1.6.2 1.2.5 1.8a1.3 1.3 0 0 1-.3 1.4l-.8.8a10.4 10.4 0 0 0 3.9 3.9l.8-.8a1.3 1.3 0 0 1 1.4-.3c.6.2 1.2.4 1.8.5a1.3 1.3 0 0 1 1.1 1.3z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #E8ECF1; --ink: #14171C; --muted: #5A6170; --line: rgba(20,23,28,0.14); --on: #0E6B66; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  header { width: 100%; max-width: 900px; padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; }
  main { flex: 1 1 auto; width: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 4px 0 16px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  figcaption { font-size: 13px; color: var(--muted); }
  .frame { position: relative; overflow: hidden; border-radius: var(--r, 44px); background: #000;
    box-shadow: 0 0 0 var(--b, 10px) #0B0D10, 0 0 0 calc(var(--b, 10px) + 1px) var(--line), 0 24px 60px rgba(0,0,0,0.35); }
  .stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  .status { padding: 24px; color: var(--muted); font-size: 14px; }
  body.phone header, body.phone figcaption { display: none; }
  body.phone main { padding: 0; align-items: center; height: 100%; }
  #back { position: fixed; left: 0; top: 0; z-index: 5; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0;
    border-radius: 50%; background: #0B0D10; color: #F2F4F7; display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 0 0 3px var(--bg), 0 6px 16px rgba(20,23,28,0.25); -webkit-tap-highlight-color: transparent;
    transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  #back:hover { transform: scale(1.06); }
  #back:active { transform: scale(0.94); }
  #back:focus-visible { outline: 2px solid var(--on); outline-offset: 3px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<header>
  <h1>reDial <span>· interactive prototype</span></h1>
</header>
<main>
  <figure id="main">
    <div class="frame"><div class="stage"><p class="status">Loading…</p></div></div>
    <figcaption>Tap a call, or pull up the sheet for favourites and contacts</figcaption>
  </figure>
</main>
<button id="back" type="button" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<script>
  const W = 390, H = 844;
  const params = new URLSearchParams(location.search);
  // ?view=home|contacts|dialer|call picks the prototype's starting screen.
  const fig = document.getElementById('main');

  function layout() {
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const phone = vw < 520;
    document.body.classList.toggle('phone', phone);
    // the frame's border (10px at full size) and corner radius scale with the phone
    const B = 10, RI = 44;
    const s = phone ? Math.min((vw - 40) / (W + 2 * B), (vh - 40) / (H + 2 * B))
      : Math.min(1, (vh - document.querySelector('header').offsetHeight - 34 - 24 - 2 * B) / H, (vw - 32 - 2 * B) / W);
    const frame = fig.querySelector('.frame');
    frame.style.width = W * s + 'px';
    frame.style.height = H * s + 'px';
    frame.style.setProperty('--b', B * s + 'px');
    frame.style.setProperty('--r', RI * s + 'px');
    fig.querySelector('.stage').style.transform = 'scale(' + s + ')';
    // back button centred on the frame's outer corner arc, at 45 degrees
    const r = frame.getBoundingClientRect(), k = (RI - (RI + B) * Math.SQRT1_2) * s;
    back.style.left = (r.left + k) + 'px'; back.style.top = (r.top + k) + 'px';
  }
  const back = document.getElementById('back');
  // Same as the browser's Back button; if this page was opened in a new tab, return to the page that linked here.
  back.addEventListener('click', function () {
    if (window.history.length > 1) { window.history.back(); return; }
    if (document.referrer) { window.location.href = document.referrer; return; }
    window.close();
  });
  window.addEventListener('resize', layout);
  layout();
  if (document.fonts) document.fonts.ready.then(layout);

  const view = params.get('view');
  const props = view ? { startScreen: view } : {};
  DCLite.mount(document.querySelector('#main .stage'), 'prototype/Prototype.dc.html', props)
    .catch((e) => { document.querySelector('#main .stage').innerHTML = '<p class="status"></p>'; document.querySelector('#main .status').textContent = e.message; });
</script>
</body>
</html>
